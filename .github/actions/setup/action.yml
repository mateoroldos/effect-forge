name: Setup workspace
description: Install the Bun toolchain pinned by package.json and the workspace dependencies.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts

    - name: Patch Effect tooling
      shell: bash
      run: bunx effect-tsgo patch --oxlint
